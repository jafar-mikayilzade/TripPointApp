name: checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - run: pip install --require-hashes -r requirements-dev.lock

      - name: Lock is in sync with declared ranges
        run: |
          report=$(pip install --dry-run -r requirements-dev.txt)
          echo "$report"
          if echo "$report" | grep -q "Would install"; then
            echo "::error::requirements*.lock is stale — regenerate it (apps/api/README.md)"
            exit 1
          fi

      - name: Import smoke
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: dummy-for-ci
        run: python -c "import main"

      - name: Lint (unused imports / dead locals)
        run: ruff check --select F app tests main.py

      - name: Unit tests
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: dummy-for-ci
          DATA_SOURCE: mock
        run: pytest -q

  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - name: Expo doctor
        run: npx expo-doctor

      - name: Export bundle (no secrets needed)
        run: npx expo export --platform android --output-dir .ci-export

      - name: Fail if server secrets appear in bundle
        run: |
          ! grep -rIl -E 'NOTIFY_SECRET|X-Notify-Secret|service_role|SUPABASE_SERVICE' .ci-export
